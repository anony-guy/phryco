<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="100%" height="100%" style="background: transparent; overflow: visible;">
  <defs>
    <!-- Dynamic gradients for icon and text -->
    <linearGradient id="phryco-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#ec4899;#8b5cf6" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="phryco-grad-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="1.0" />
    </linearGradient>
    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f8fafc" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .orbit-ring {
      transform-origin: 27px 27px;
      animation: spin 12s linear infinite;
    }
    .inner-pulse {
      transform-origin: 27px 27px;
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .play-triangle {
      transform-origin: 27px 27px;
      animation: hover-float 4s ease-in-out infinite alternate;
      filter: drop-shadow(0px 2px 6px rgba(99, 102, 241, 0.6));
    }
    .wordmark {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.04em;
      fill: url(#text-shimmer);
    }
    .tagline-dot {
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes hover-float {
      0% { transform: translateY(-1.5px) scale(0.98); }
      100% { transform: translateY(1.5px) scale(1.02); }
    }
    @keyframes ping {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
  </style>

  <!-- Left Logo Icon Group (Centered at X=27, Y=27) -->
  <g class="logo-icon">
    <!-- Outer Orbital Waveform Ring -->
    <circle class="orbit-ring" cx="27" cy="27" r="23" fill="none" stroke="url(#phryco-grad-ring)" stroke-width="2.5" stroke-dasharray="24 8 12 8" stroke-linecap="round" filter="url(#neon-glow)" />
    
    <!-- Inner Glowing Shield Disc -->
    <circle class="inner-pulse" cx="27" cy="27" r="17" fill="url(#phryco-grad-primary)" opacity="0.85" />
    <circle cx="27" cy="27" r="15" fill="#0f172a" opacity="0.9" />
    
    <!-- Futuristic Geometric Play Triangle -->
    <path class="play-triangle" d="M 23 18.5 L 35 27 L 23 35.5 Z" fill="url(#phryco-grad-primary)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" />
  </g>

  <!-- Right Typography Wordmark -->
  <g transform="translate(62, 35)">
    <text class="wordmark" x="0" y="0">PHRYCO</text>
    <circle class="tagline-dot" cx="132" cy="-6" r="3.5" fill="#ec4899" filter="url(#neon-glow)" />
  </g>
</svg>
