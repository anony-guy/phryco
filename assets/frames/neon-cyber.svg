<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <rect width="100%" height="100%" fill="transparent" />
    
    <!-- Outer Cybernetic Corner Accents -->
    <path d="M 120 180 L 120 120 L 220 120" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)"/>
    <path d="M 1800 180 L 1800 120 L 1700 120" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)"/>
    <path d="M 120 900 L 120 960 L 220 960" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)"/>
    <path d="M 1800 900 L 1800 960 L 1700 960" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#glow)"/>

    <!-- Glowing Cyber Perimeter Border (Normalized to 1600x900 inner window) -->
    <rect x="150" y="80" width="1620" height="920" fill="none" stroke="url(#neonGrad)" stroke-width="16" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="160" y="90" width="1600" height="900" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="15 15">
        <animate attributeName="stroke-dashoffset" from="0" to="30" dur="1.5s" repeatCount="indefinite" />
    </rect>
</svg>
