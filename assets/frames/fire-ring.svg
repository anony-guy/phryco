<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
        <!-- Intense Fire Glow -->
        <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15" result="blur1"/>
            <feGaussianBlur stdDeviation="8" result="blur2"/>
            <feGaussianBlur stdDeviation="3" result="blur3"/>
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur3"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Soft Glow -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Fire Gradients -->
        <linearGradient id="coreFire" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="30%" stop-color="#FFEB3B" />
            <stop offset="70%" stop-color="#FF9800" />
            <stop offset="100%" stop-color="#D50000" />
        </linearGradient>
        
        <linearGradient id="outerFire" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FFEB3B" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#FF5722" stop-opacity="0.9"/>
            <stop offset="85%" stop-color="#b71c1c" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#212121" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD54F" />
            <stop offset="50%" stop-color="#FF6F00" />
            <stop offset="100%" stop-color="#B71C1C" />
        </linearGradient>
        
        <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="40%" stop-color="#FFEA00"/>
            <stop offset="80%" stop-color="#FF3D00"/>
            <stop offset="100%" stop-color="#FF3D00" stop-opacity="0"/>
        </radialGradient>

        <!-- Reusable Flame Tongue -->
        <g id="flameTongue">
            <path d="M -30 0 C -30 -60 -15 -100 -5 -150 C -30 -100 10 -180 0 -220 C 10 -150 -5 -80 20 -130 C 10 -80 30 -50 30 0 Z" fill="url(#outerFire)" filter="url(#fireGlow)">
                <animateTransform attributeName="transform" type="scale" values="1,1; 1.1,1.25; 0.9,0.9; 1,1" dur="1.2s" repeatCount="indefinite"/>
            </path>
            <path d="M -15 0 C -15 -40 -5 -70 0 -120 C 10 -80 -5 -50 15 0 Z" fill="url(#coreFire)" opacity="0.9" filter="url(#softGlow)">
                <animateTransform attributeName="transform" type="scale" values="1,1; 0.9,1.15; 1.05,0.85; 1,1" dur="0.8s" repeatCount="indefinite"/>
            </path>
        </g>
    </defs>
    
    <!-- Transparent background around flames -->

    <!-- Top Wall of Fire (Raging Upward) -->
    <g transform="translate(0, 130)">
        <path d="M 120 0 Q 300 -120 450 -40 Q 600 -130 800 -30 Q 960 -150 1100 -50 Q 1300 -140 1500 -30 Q 1700 -130 1800 0 Z" fill="url(#outerFire)" filter="url(#fireGlow)">
            <animate attributeName="d" 
                values="M 120 0 Q 300 -120 450 -40 Q 600 -130 800 -30 Q 960 -150 1100 -50 Q 1300 -140 1500 -30 Q 1700 -130 1800 0 Z;
                        M 120 0 Q 330 -80 500 -90 Q 650 -60 780 -140 Q 960 -70 1150 -120 Q 1350 -50 1550 -110 Q 1700 -60 1800 0 Z;
                        M 120 0 Q 300 -120 450 -40 Q 600 -130 800 -30 Q 960 -150 1100 -50 Q 1300 -140 1500 -30 Q 1700 -130 1800 0 Z" 
                dur="2.5s" repeatCount="indefinite"/>
        </path>
        <path d="M 160 0 Q 350 -80 520 -30 Q 750 -100 960 -40 Q 1200 -100 1450 -40 Q 1650 -90 1760 0 Z" fill="url(#coreFire)" opacity="0.8" filter="url(#softGlow)">
            <animate attributeName="d" 
                values="M 160 0 Q 350 -80 520 -30 Q 750 -100 960 -40 Q 1200 -100 1450 -40 Q 1650 -90 1760 0 Z;
                        M 160 0 Q 400 -40 600 -80 Q 850 -40 1000 -90 Q 1250 -50 1400 -80 Q 1600 -40 1760 0 Z;
                        M 160 0 Q 350 -80 520 -30 Q 750 -100 960 -40 Q 1200 -100 1450 -40 Q 1650 -90 1760 0 Z" 
                dur="1.8s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Bottom Wall of Fire (Erupting Downwards & Sideways) -->
    <g transform="translate(0, 950)">
        <path d="M 120 0 Q 400 100 700 30 Q 960 120 1200 40 Q 1500 110 1800 0 Z" fill="url(#outerFire)" filter="url(#fireGlow)">
            <animate attributeName="d" 
                values="M 120 0 Q 400 100 700 30 Q 960 120 1200 40 Q 1500 110 1800 0 Z;
                        M 120 0 Q 350 40 650 90 Q 960 40 1300 100 Q 1600 50 1800 0 Z;
                        M 120 0 Q 400 100 700 30 Q 960 120 1200 40 Q 1500 110 1800 0 Z" 
                dur="2.2s" repeatCount="indefinite"/>
        </path>
    </g>
    
    <!-- Left Fire Wall -->
    <g transform="translate(130, 0)">
        <path d="M 0 120 Q -100 300 -30 540 Q -110 750 0 960 Z" fill="url(#outerFire)" filter="url(#fireGlow)">
            <animate attributeName="d"
                values="M 0 120 Q -100 300 -30 540 Q -110 750 0 960 Z;
                        M 0 120 Q -40 350 -90 540 Q -50 800 0 960 Z;
                        M 0 120 Q -100 300 -30 540 Q -110 750 0 960 Z"
                dur="2s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Right Fire Wall -->
    <g transform="translate(1790, 0)">
        <path d="M 0 120 Q 100 300 30 540 Q 110 750 0 960 Z" fill="url(#outerFire)" filter="url(#fireGlow)">
            <animate attributeName="d"
                values="M 0 120 Q 100 300 30 540 Q 110 750 0 960 Z;
                        M 0 120 Q 40 350 90 540 Q 50 800 0 960 Z;
                        M 0 120 Q 100 300 30 540 Q 110 750 0 960 Z"
                dur="2s" repeatCount="indefinite"/>
        </path>
    </g>

    <!-- Corner Flaming Tongues -->
    <g transform="translate(140, 140) rotate(-45) scale(1.5)"><use href="#flameTongue" /></g>
    <g transform="translate(1780, 140) rotate(45) scale(1.5)"><use href="#flameTongue" /></g>
    <g transform="translate(140, 940) rotate(-135) scale(1.3)"><use href="#flameTongue" /></g>
    <g transform="translate(1780, 940) rotate(135) scale(1.3)"><use href="#flameTongue" /></g>
    
    <!-- Additional Accent Flames around border -->
    <g transform="translate(600, 130) scale(1.2)"><use href="#flameTongue" /></g>
    <g transform="translate(1320, 130) scale(1.2)"><use href="#flameTongue" /></g>

    <!-- Ornate Magma Inner Border -->
    <rect x="160" y="90" width="1600" height="900" fill="none" stroke="url(#emberGrad)" stroke-width="6" filter="url(#fireGlow)">
        <animate attributeName="stroke-width" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="163" y="93" width="1594" height="894" fill="none" stroke="#FFEA00" stroke-width="2" opacity="0.8" filter="url(#softGlow)"/>

    <!-- Floating Embers and Sparks -->
    <circle cx="200" cy="900" r="6" fill="url(#sparkGrad)" filter="url(#softGlow)">
        <animate attributeName="cy" values="900;200" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="200;150;220;180" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1700" cy="850" r="8" fill="url(#sparkGrad)" filter="url(#softGlow)">
        <animate attributeName="cy" values="850;150" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1700;1750;1680;1720" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.9;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="950" r="5" fill="url(#sparkGrad)" filter="url(#softGlow)">
        <animate attributeName="cy" values="950;100" dur="5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1000;960;1030;990" dur="5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.7;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="920" r="7" fill="url(#sparkGrad)" filter="url(#softGlow)">
        <animate attributeName="cy" values="920;120" dur="3.8s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="500;470;530;490" dur="3.8s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.6;0" dur="3.8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="900" r="6" fill="url(#sparkGrad)" filter="url(#softGlow)">
        <animate attributeName="cy" values="900;180" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1400;1440;1380;1420" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.8;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
</svg>
