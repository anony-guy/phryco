<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
        <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#ff0000" />
            <stop offset="50%" stop-color="#ff7b00" />
            <stop offset="100%" stop-color="#ffea00" />
        </linearGradient>
    </defs>
    
    <rect width="100%" height="100%" fill="transparent" />
    
    <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="url(#fire)" stroke-width="25">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="20;30;20" dur="1s" repeatCount="indefinite"/>
    </rect>
</svg>
