<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#BF953F" />
            <stop offset="25%" stop-color="#FCF6BA" />
            <stop offset="50%" stop-color="#B38728" />
            <stop offset="75%" stop-color="#FBF5B7" />
            <stop offset="100%" stop-color="#AA771C" />
        </linearGradient>
    </defs>
    
    <rect width="100%" height="100%" fill="transparent" />
    
    <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="url(#gold)" stroke-width="40">
        <animate attributeName="stroke-width" values="30;40;30" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#FFF" stroke-width="2" opacity="0.5"/>
</svg>
