<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
        <!-- Intense Glow -->
        <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="20" result="blur1"/>
            <feGaussianBlur stdDeviation="10" result="blur2"/>
            <feGaussianBlur stdDeviation="5" result="blur3"/>
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur3"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Standard Glow -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Golden Gradients -->
        <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF9C4" />
            <stop offset="50%" stop-color="#FFD54F" />
            <stop offset="100%" stop-color="#F57F17" />
        </linearGradient>

        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="70%" stop-color="#E3F2FD" />
            <stop offset="100%" stop-color="#90CAF9" />
        </linearGradient>
        
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#FFF9C4" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
        </linearGradient>
        
        <!-- Wing Template -->
        <g id="wingLayer">
            <!-- Primary majestic feathers -->
            <path d="M 0 0 C -40 -150 -60 -300 -120 -380 C -80 -250 -40 -150 0 -50 Z" fill="url(#wingGrad)" filter="url(#glow)"/>
            <path d="M -10 -40 C -50 -180 -70 -330 -130 -410 C -90 -280 -50 -180 -10 -80 Z" fill="url(#wingGrad)" opacity="0.9" filter="url(#glow)"/>
            <path d="M -20 -80 C -60 -210 -80 -360 -140 -440 C -100 -310 -60 -210 -20 -110 Z" fill="url(#wingGrad)" opacity="0.8" filter="url(#glow)"/>
            <!-- Secondary overlapping feathers -->
            <path d="M -30 20 C -70 -100 -100 -200 -140 -250 C -100 -150 -60 -50 -30 50 Z" fill="#FFFFFF" opacity="0.75" filter="url(#glow)"/>
            <path d="M -50 60 C -90 -50 -120 -150 -160 -200 C -120 -100 -80 0 -50 90 Z" fill="#FFFFFF" opacity="0.65" filter="url(#glow)"/>
            <!-- Tertiary base fluff -->
            <path d="M 20 80 C 0 0 -20 -80 -50 -120 C -20 -40 10 40 40 120 Z" fill="#E3F2FD" opacity="0.6" filter="url(#glow)"/>
            <path d="M 10 120 C -10 40 -30 -40 -60 -80 C -30 0 0 80 30 160 Z" fill="#FFFFFF" opacity="0.5" filter="url(#glow)"/>
        </g>
    </defs>
    
    <!-- Outer letterbox dimmer -->
    <path d="M 0 0 L 1920 0 L 1920 1080 L 0 1080 Z M 150 150 L 150 930 L 1770 930 L 1770 150 Z" fill="#030308" opacity="0.8" />
    
    <!-- Ornate Inner Frame -->
    <rect x="150" y="150" width="1620" height="780" fill="none" stroke="url(#frameGrad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Frame corner accents -->
    <path d="M 140 180 L 140 140 L 180 140" fill="none" stroke="#FFD54F" stroke-width="6" filter="url(#glow)"/>
    <path d="M 1780 180 L 1780 140 L 1740 140" fill="none" stroke="#FFD54F" stroke-width="6" filter="url(#glow)"/>
    <path d="M 140 900 L 140 940 L 180 940" fill="none" stroke="#FFD54F" stroke-width="6" filter="url(#glow)"/>
    <path d="M 1780 900 L 1780 940 L 1740 940" fill="none" stroke="#FFD54F" stroke-width="6" filter="url(#glow)"/>
    
    <!-- Grand Halo -->
    <g transform="translate(960, 75)">
        <!-- Hover animation -->
        <animateTransform attributeName="transform" type="translate" values="960,75; 960,85; 960,75" dur="4s" repeatCount="indefinite"/>
        
        <!-- Radiant beams -->
        <path d="M -180 0 L -220 0 M 180 0 L 220 0 M 0 -35 L 0 -55" stroke="#FFD54F" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
        
        <!-- Outer majestic ring -->
        <ellipse cx="0" cy="0" rx="160" ry="25" fill="none" stroke="url(#haloGrad)" stroke-width="12" filter="url(#glow)">
            <animate attributeName="stroke-width" values="8;14;8" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        
        <!-- Inner bright ring -->
        <ellipse cx="0" cy="0" rx="145" ry="20" fill="none" stroke="#FFFFFF" stroke-width="4" filter="url(#intenseGlow)"/>
    </g>

    <!-- Floating Ethereal Particles -->
    <circle cx="300" cy="300" r="4" fill="#FFF9C4" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0;0.8;0" dur="4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;250;300" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="200" r="5" fill="#FFF9C4" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;140;200" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="800" r="6" fill="#FFF9C4" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="800;750;800" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="850" r="3" fill="#FFF9C4" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="850;790;850" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="150" r="4" fill="#FFFFFF" filter="url(#intenseGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="150;130;150" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>

    <!-- Left Wing Assembly -->
    <g transform="translate(150, 540)">
        <g>
            <animateTransform attributeName="transform" type="rotate" values="-8;5;-8" dur="3.5s" repeatCount="indefinite" />
            <use href="#wingLayer" />
            <!-- Second overlapping layer for depth -->
            <g transform="scale(0.8) rotate(15)">
                <use href="#wingLayer" opacity="0.8" />
            </g>
            <g transform="scale(0.6) rotate(30)">
                <use href="#wingLayer" opacity="0.6" />
            </g>
        </g>
    </g>

    <!-- Right Wing Assembly (Mirrored) -->
    <g transform="translate(1770, 540)">
        <g transform="scale(-1, 1)">
            <g>
                <animateTransform attributeName="transform" type="rotate" values="-8;5;-8" dur="3.5s" repeatCount="indefinite" />
                <use href="#wingLayer" />
                <g transform="scale(0.8) rotate(15)">
                    <use href="#wingLayer" opacity="0.8" />
                </g>
                <g transform="scale(0.6) rotate(30)">
                    <use href="#wingLayer" opacity="0.6" />
                </g>
            </g>
        </g>
    </g>
</svg>
