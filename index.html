<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phryco - Cinematic Video Streaming & Community</title>
    <link rel="stylesheet" href="./css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <header>
        <a href="./" class="logo">
            <i data-lucide="play-circle"></i>
            Phryco
        </a>
        <div class="search-bar search-bar-container">
            <input type="text" placeholder="Search cinematic videos & creators..." class="input-pill">
        </div>
        <nav class="nav-links">
            <div class="phrybucks-badge" id="phrybucks-display">
                <i data-lucide="coins"></i>
                <span id="pb-balance">0 PB</span>
            </div>
            <a href="./pages/studio/upload.html" class="btn-primary">
                <i data-lucide="upload" style="width: 18px; height: 18px;"></i> Upload
            </a>
            <a href="./pages/notifications/index.html" class="icon-btn" title="Notifications">
                <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
            </a>
            <div class="user-menu-container">
                <a href="#" id="user-menu-btn" class="icon-btn" title="User Menu">
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                </a>
                <div id="user-dropdown" class="dropdown-menu"></div>
            </div>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="./" class="active"><i data-lucide="home"></i> Home</a>
            <a href="./pages/trending/index.html"><i data-lucide="trending-up"></i> Trending</a>
            <a href="./pages/explore/index.html"><i data-lucide="compass"></i> Explore</a>
            <a href="./pages/qna/index.html"><i data-lucide="help-circle"></i> QnA Forum</a>
            <a href="./pages/shop/index.html"><i data-lucide="shopping-cart"></i> Shop</a>
            <div class="sidebar-footer" style="margin-top: auto; padding-top: 2rem;">
                <div class="dropdown-divider"></div>
                <a href="./pages/documentation/index.html"><i data-lucide="book-open"></i> Documentation</a>
                <a href="./pages/legal/terms.html"><i data-lucide="shield"></i> Terms of Service</a>
                <a href="./pages/legal/privacy.html"><i data-lucide="lock"></i> Privacy Policy</a>
            </div>
        </aside>

        <main class="content">
            <h1 class="text-gradient" style="margin-bottom: 2rem;">Recommended For You</h1>
            <div class="video-grid" id="video-container">
                <!-- Video cards injected dynamically via JS -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });
    </script>
    <script type="module" src="./js/pages/home.js"></script>
    <script type="module" src="./js/components/header.js"></script>
</body>
</html>
