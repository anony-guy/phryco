<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Watch, stream, and share high-quality cinematic videos on Phryco. Discover trending content, earn PhryBucks, and connect with creators worldwide.">
    <meta name="google-site-verification" content="-DRupuSJZ6WoyubyP7YuTqpa2V4l96sWbY8Eg5q6KxU" />
    <title>Phryco - Cinematic Video Streaming & Community</title>

    <!-- Google WebSite & SearchAction Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Phryco",
      "url": "https://phryco.vercel.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://phryco.vercel.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Preconnect Hints for Faster Origin Connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.prod.website-files.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap">
    
    <link rel="stylesheet" href="./css/index.css">
    <script defer src="/js/vendor/lucide.min.js"></script>
    <script type="module" src="/js/utils/idb_storage.js"></script>
    <script type="module" src="/js/utils/storage_buckets.js"></script>
    <script type="module" src="/js/utils/dbsc_shield.js"></script>
    <script type="module" src="/js/components/os_modal.js"></script>
    <script src="/js/vendor/vaultguard/vaultguard.js"></script>
</head>
<body>
    <header>
        <a href="./" class="logo">
            <i data-lucide="play-circle"></i>
            Phryco
        </a>
        <div class="search-bar search-bar-container">
            <input type="text" placeholder="Search cinematic videos & creators..." class="input-pill">
        </div>
        <nav class="nav-links">
            <a href="https://github.com/anony-guy/phryco" target="_blank" rel="noopener noreferrer" class="github-os-badge" title="Phryco is an experimental open-source project on GitHub">
                <img src="https://miro.medium.com/1*dDNpLKu_oTLzStsDTnkJ-g.png" alt="GitHub Logo" class="github-badge-icon">
                <span>Open Source</span>
            </a>
            <div class="phrybucks-badge" id="phrybucks-display">
                <i data-lucide="coins"></i>
                <span id="pb-balance">0 PB</span>
            </div>
            <a href="./pages/studio/upload.html" class="btn-primary">
                <i data-lucide="upload" style="width: 18px; height: 18px;"></i> Upload
            </a>
            <a href="./pages/notifications/index.html" class="icon-btn" title="Notifications">
                <i data-lucide="bell" style="width: 18px; height: 18px;"></i>
            </a>
            <div class="user-menu-container">
                <a href="#" id="user-menu-btn" class="icon-btn" title="User Menu">
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                </a>
                <div id="user-dropdown" class="dropdown-menu"></div>
            </div>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="./" class="active"><i data-lucide="home"></i> Home</a>
            <a href="./pages/trending/index.html"><i data-lucide="trending-up"></i> Trending</a>
            <a href="./pages/explore/index.html"><i data-lucide="compass"></i> Explore</a>
            <div class="sidebar-footer" style="margin-top: auto; padding-top: 2rem;">
                <div class="dropdown-divider"></div>
                <a href="./pages/documentation/index.html"><i data-lucide="book-open"></i> Documentation</a>
                <a href="./pages/legal/terms.html"><i data-lucide="shield"></i> Terms of Service</a>
                <a href="./pages/legal/privacy.html"><i data-lucide="lock"></i> Privacy Policy</a>
                <div class="dropdown-divider"></div>
                <a href="https://kashier.io/" target="_blank" rel="noopener" title="Kashier Payment Solutions" style="display: flex; align-items: center; padding: 0.5rem 0; opacity: 0.9; transition: opacity 0.2s ease;">
                    <img src="https://cdn.prod.website-files.com/5e7783f66312835b392f3113/62e9f740edb082afb1ec27c9_Kashier-payment-solutions-logo.png" alt="Kashier Payment Solutions" width="100" height="22" style="height: 22px; width: auto; filter: brightness(1.1);">
                </a>
            </div>
        </aside>

        <main class="content">
            <h1 class="text-gradient" style="margin-bottom: 2rem;">Recommended For You</h1>
            <div class="video-grid" id="video-container">
                <!-- Video cards injected dynamically via JS -->
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });
    </script>
    <script type="module" src="./js/pages/home.js"></script>
    <script type="module" src="./js/components/header.js"></script>
</body>
</html>
