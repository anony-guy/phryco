<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Recovery Code - Phryco</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .code-input-container {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .code-input-container input {
            width: 3rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            font-weight: bold;
        }
        .code-input-container input:focus {
            border-color: var(--accent-primary);
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle" style="color: var(--accent-primary);"></i>
            Phryco
        </a>
    </header>

    <div class="layout" style="justify-content: center; align-items: center;">
        <div class="auth-container animate-fade-in">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Check Your Email</h2>
            <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
                We've sent a 6-digit recovery code to <strong id="display-email">your email</strong>.
            </p>
            <form id="verify-form">
                <div class="form-group">
                    <div class="code-input-container" id="code-inputs">
                        <input type="text" maxlength="1" required>
                        <input type="text" maxlength="1" required>
                        <input type="text" maxlength="1" required>
                        <input type="text" maxlength="1" required>
                        <input type="text" maxlength="1" required>
                        <input type="text" maxlength="1" required>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%; padding: 1rem;">Verify Code</button>
            </form>
            <p id="error-msg" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;"></p>
            <div class="auth-footer">
                <a href="../forgot-password/index.html">Resend Code</a>
            </div>
        </div>
    </div>

    <script>document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });</script>
    <script type="module" src="../../js/pages/verify-recovery.js"></script>
</body>
</html>
