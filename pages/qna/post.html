<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QnA Thread - Phryco</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        .thread-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .original-post {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .op-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        .op-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .op-pfp {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
        .op-username {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        .op-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .op-status {
            margin-left: auto;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-PUBLISHED { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .status-RESOLVED { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        
        .op-content {
            font-size: 1.1rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .op-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .op-gallery img {
            width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        
        .replies-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .reply-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        .reply-card.accepted {
            border: 2px solid #22c55e;
            background: rgba(34, 197, 94, 0.05);
        }
        .reply-pfp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .reply-content {
            flex: 1;
        }
        .reply-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .reply-username {
            font-weight: 500;
            color: var(--text-primary);
        }
        .reply-role {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background: var(--accent-primary);
            color: white;
            font-weight: bold;
        }
        .reply-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-left: auto;
        }
        .reply-message {
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        
        .reply-input-area {
            margin-top: 2rem;
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .reply-input-area h3 {
            margin-bottom: 1rem;
        }
        .reply-textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            color: var(--text-primary);
            resize: vertical;
            min-height: 100px;
            margin-bottom: 1rem;
            outline: none;
        }
        .reply-textarea:focus {
            border-color: var(--accent-primary);
        }
        
        .accepted-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            color: #22c55e;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle" style="color: var(--accent-primary);"></i>
            Phryco
        </a>
        <div class="search-bar" style="flex: 1; max-width: 500px; margin: 0 2rem;">
            <input type="text" placeholder="Search videos..." style="width: 100%; padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); outline: none;">
        </div>
        <nav class="nav-links">
            <div class="phrybucks-badge" id="phrybucks-display">
                <i data-lucide="coins" style="width: 16px; height: 16px;"></i>
                <span id="pb-balance">0 PB</span>
            </div>
            <a href="../../pages/studio/upload.html" class="btn-primary" style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="upload" style="width: 18px; height: 18px;"></i> Upload
            </a>
            <a href="../../pages/notifications/index.html">
                <i data-lucide="bell"></i>
            </a>
            <div class="user-menu-container" style="position: relative;">
                <a href="#" id="user-menu-btn" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--bg-secondary); text-decoration: none;">
                    <i data-lucide="user" style="color: var(--text-secondary);"></i>
                </a>
                <div id="user-dropdown" class="dropdown-menu"></div>
            </div>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="../../"><i data-lucide="home"></i> Home</a>
            <a href="../../pages/trending/index.html"><i data-lucide="trending-up"></i> Trending</a>
            <a href="../../pages/explore/index.html"><i data-lucide="compass"></i> Explore</a>
            <a href="../../pages/qna/index.html" class="active"><i data-lucide="help-circle"></i> QnA Forum</a>
        </aside>

        <main class="content">
            <div class="thread-container" id="thread-container">
                <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">Loading thread...</div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });
    </script>
    <script type="module" src="../../js/pages/qna_post.js"></script>
    <script type="module" src="../../js/components/header.js"></script>
</body>
</html>
