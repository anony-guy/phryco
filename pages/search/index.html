<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Phryco</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .search-results-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
            max-width: 800px;
        }
        
        .search-result-card {
            display: flex;
            gap: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        
        .search-result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .search-result-thumbnail {
            width: 320px;
            height: 180px;
            background: #000;
            position: relative;
            flex-shrink: 0;
        }
        
        .search-result-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .search-result-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .search-result-title {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-primary);
            line-height: 1.3;
        }
        
        .search-result-meta {
            color: var(--text-secondary);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .search-result-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle" style="color: var(--accent-primary);"></i>
            Phryco
        </a>
        <div class="search-bar" style="flex: 1; max-width: 500px; margin: 0 2rem;">
            <input type="text" placeholder="Search videos..." style="width: 100%; padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); outline: none;">
        </div>
        <nav class="nav-links">
            <div class="phrybucks-badge" id="phrybucks-display">
                <i data-lucide="coins" style="width: 16px; height: 16px;"></i>
                <span id="pb-balance">0 PB</span>
            </div>
            <a href="../../pages/studio/upload.html" class="btn-primary" style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="upload" style="width: 18px; height: 18px;"></i> Upload
            </a>
            <a href="../../pages/notifications/index.html">
                <i data-lucide="bell"></i>
            </a>
            <div class="user-menu-container" style="position: relative;">
                <a href="#" id="user-menu-btn" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--bg-secondary); text-decoration: none;">
                    <i data-lucide="user" style="color: var(--text-secondary);"></i>
                </a>
                <div id="user-dropdown" class="dropdown-menu"></div>
            </div>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="../../"><i data-lucide="home"></i> Home</a>
            <a href="../../pages/trending/index.html"><i data-lucide="trending-up"></i> Trending</a>
            <a href="../../pages/explore/index.html"><i data-lucide="compass"></i> Explore</a>
            <a href="../../pages/history/index.html"><i data-lucide="history"></i> History</a>
        </aside>

        <main class="content">
            <h1 id="search-title">Search Results</h1>
            
            <div class="search-results-grid" id="search-results">
                <div class="loading-spinner"></div>
            </div>
        </main>
    </div>

    <script type="module" src="../../js/components/header.js"></script>
    <script type="module" src="../../js/pages/search.js"></script>
</body>
</html>
