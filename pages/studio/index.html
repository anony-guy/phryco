<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio - Dashboard</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle"></i>
            Phryco Studio
        </a>
    </header>

    <div class="layout">
        <main class="content">
            <nav class="studio-nav">
                <a href="../../pages/studio/index.html" class="active">Dashboard</a>
                <a href="../../pages/studio/content.html">Content</a>
                <a href="../../pages/studio/upload.html">Upload</a>
                <a href="../../pages/studio/economy.html">Economy</a>
                <a href="../../pages/studio/emojis.html">Emojis</a>
                <a href="../../pages/studio/ads.html">Ads</a>
                <a href="../../pages/studio/invites.html">Invites</a>
            </nav>

            <div class="channel-header animate-fade-in">
                <!-- Channel Banner -->
                <input type="file" id="banner-input" style="display: none;" accept="image/*">
                <div class="channel-banner" id="banner-placeholder" onclick="document.getElementById('banner-input').click()">
                    <span>Click to upload Banner</span>
                </div>
                <!-- Channel Avatar -->
                <input type="file" id="avatar-input" style="display: none;" accept="image/*">
                <div class="channel-avatar" id="avatar-placeholder" onclick="document.getElementById('avatar-input').click()">
                    <i data-lucide="user"></i>
                </div>
            </div>

            <div style="padding-left: 8rem; display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1rem;">
                <h1 id="channel-name" class="text-gradient">Your Channel</h1>
                <a href="../../pages/studio/settings.html" class="btn-secondary">
                    <i data-lucide="settings" style="width:16px; height:16px;"></i> Channel Settings
                </a>
            </div>

            <div class="analytics-grid animate-fade-in">
                <div class="stat-card">
                    <span class="label">Total Views</span>
                    <span class="value" id="stat-views">0</span>
                </div>
                <div class="stat-card">
                    <span class="label">Total Likes</span>
                    <span class="value" id="stat-likes">0</span>
                </div>
                <div class="stat-card" style="border-color: rgba(251, 191, 36, 0.3);">
                    <span class="label" style="color: var(--phrybucks-gold);">Phrybucks Balance</span>
                    <span class="value" id="stat-phrybucks">0 PB</span>
                </div>
            </div>
        </main>
    </div>

    <script>document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });</script>
    <script type="module" src="../../js/pages/studio/dashboard.js"></script>
<script type="module" src="../../js/components/header.js"></script>
    </body>
</html>
