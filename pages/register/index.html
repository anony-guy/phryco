<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Phryco</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent-primary);
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle" style="color: var(--accent-primary);"></i>
            Phryco
        </a>
    </header>

    <div class="layout" style="justify-content: center; align-items: center;">
        <div class="auth-container animate-fade-in">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Create an Account</h2>
            <form id="register-container" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="auth-user" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="auth-email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-key" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" required>
                </div>
                <div class="form-group">
                    <label>Invite Code</label>
                    <input type="text" id="invite-code" placeholder="PHRY-XXXX-XXXX" required>
                    <small style="color: var(--text-secondary); font-size: 12px; margin-top: 4px; display: block;">An invite code is required to join Phryco.</small>
                </div>
                
                <div class="form-group" style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
                    <label>Proof of Humanity</label>
                    <p id="file-prompt" style="margin-bottom: 0.5rem; font-weight: bold; color: var(--accent-primary); font-size: 0.875rem;">Loading challenge...</p>
                    <input type="file" id="human-file" required style="width: 100%; padding: 0.5rem; background: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: var(--radius-md); color: var(--text-primary);">
                </div>

                <div class="form-group" style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
                    <label style="font-weight: 700; color: #ffffff; margin-bottom: 0.75rem; display: block;">Mandatory Legal Agreements</label>
                    
                    <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="agree-tos" required style="width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;">
                        <span>I have read and agree to the Terms of Service</span>
                    </label>

                    <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="agree-privacy" required style="width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;">
                        <span>I have read and agree to the Privacy Policy</span>
                    </label>

                    <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.85rem; color: #cbd5e1; cursor: pointer;">
                        <input type="checkbox" id="agree-license" required style="width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;">
                        <span>I have read and agree to the Ethical Source License</span>
                    </label>
                </div>
                
                <button id="submit-btn" class="btn-primary" style="width: 100%; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <span>Sign Up</span>
                </button>
                <p id="pow-status" style="text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 0.5rem;"></p>
            </form>
            <p id="error-msg" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;"></p>
            <div class="auth-footer">
                Already have an account? <a href="../../pages/login/index.html">Log In</a>
            </div>
        </div>
    </div>

    <!-- Captcha Modal -->
    <div id="captcha-modal" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; padding: 1rem; backdrop-filter: blur(4px);">
        <div class="animate-fade-in" style="background: var(--bg-secondary); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0; color: var(--text-primary);">Security Check</h3>
                <button id="close-captcha-modal" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px;"><i data-lucide="x"></i></button>
            </div>
            <div id="vg-captcha"></div>
        </div>
    </div>

    <script src="../../js/vendor/vaultguard.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });</script>
    <script type="module" src="../../js/pages/register.js"></script>
<script type="module" src="../../js/components/header.js"></script>
    </body>
</html>
