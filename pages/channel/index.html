<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Profile - Phryco</title>
    <link rel="stylesheet" href="../../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .channel-header {
            position: relative;
            margin-bottom: 3rem;
        }
        .channel-banner {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--accent-primary));
            border-radius: var(--radius-lg);
            background-size: cover;
            background-position: center;
        }
        .channel-avatar {
            width: 120px;
            height: 120px;
            background: var(--bg-primary);
            border: 4px solid var(--bg-primary);
            border-radius: 50%;
            position: absolute;
            bottom: -40px;
            left: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-secondary);
            overflow: hidden;
        }
        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../" class="logo">
            <i data-lucide="play-circle" style="color: var(--accent-primary);"></i>
            Phryco
        </a>
    </header>

    <div class="layout" style="display: block;">
        <main class="content" style="max-width: 1200px; margin: 0 auto;">
            
            <div class="channel-header animate-fade-in" id="channel-header">
                <div class="channel-banner" id="banner-el"></div>
                <div class="channel-avatar" id="avatar-el">
                    <i data-lucide="user"></i>
                </div>
            </div>

            <div style="margin-left: 11rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <h1 id="channel-name" style="margin: 0;">Loading...</h1>
                    <span id="channel-stats" style="color: var(--text-secondary);">0 Subscribers &bull; 0 Videos</span>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button id="join-btn" style="display: none; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; border: 1px solid var(--accent-primary); color: var(--accent-primary); background: transparent; cursor: pointer; transition: all var(--transition-fast);">
                        Join
                    </button>
                    <button id="subscribe-btn" style="display: none; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; border: none; cursor: pointer; transition: all var(--transition-fast); background: white; color: black;">
                        Subscribe
                    </button>
                </div>
            </div>
            
            <!-- Join Membership Modal -->
            <div id="join-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
                <div style="background: var(--bg-secondary); width: 90%; max-width: 600px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; max-height: 80vh;">
                    <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
                        <h3 style="margin: 0; font-size: 1.25rem;">Join <span id="join-channel-name">this channel</span></h3>
                        <button onclick="document.getElementById('join-modal').style.display='none'" style="background: transparent; border: none; color: var(--text-secondary); cursor: pointer;"><i data-lucide="x"></i></button>
                    </div>
                    <div id="join-tiers-container" style="padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; flex-grow: 1;">
                        <p style="color: var(--text-secondary);">Loading membership options...</p>
                    </div>
                </div>
            </div>
            
            <div style="margin: 2rem 0; border-top: 1px solid var(--border-color);"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0;">Videos</h2>
                <div style="position: relative; width: 300px;">
                    <i data-lucide="search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 1.2rem; height: 1.2rem;"></i>
                    <input type="text" id="channel-search" placeholder="Search channel..." style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 9999px; color: var(--text-primary);">
                </div>
            </div>
            <div class="video-grid" id="video-container">
                <!-- Videos injected here -->
            </div>
            
        </main>
    </div>

    <script>document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide script failed to load from CDN.");
            }
        });</script>
    <script type="module" src="../../js/pages/channel.js"></script>
<script type="module" src="../../js/components/header.js"></script>
    </body>
</html>
